name: Automated Profile Pipeline

on:
  schedule:
    # Run every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "config/**"
      - "scripts/**"

jobs:
  update-profile-system:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate & Generate Assets
        run: |
          node scripts/generate-hero.js
          node scripts/generate-skills.js
          node scripts/generate-roadmap.js
          node scripts/generate-project-assets.js
          node scripts/optimize-assets.js

      - name: Generate Contribution Grid Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#FF6A1F&color_dots=#161616,#331F14,#732E0E,#B34715,#FF6A1F

      - name: Commit Asset Updates
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --quiet && git diff --staged --quiet || git commit -m "chore(profile): automated asset pipeline regeneration [skip ci]"
          git push origin main || echo "No changes to push"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
