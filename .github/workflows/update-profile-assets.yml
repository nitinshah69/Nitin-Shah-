name: Generate Profile Contribution Snake

on:
  schedule:
    # Recurring cron disabled to eliminate minute consumption on schedules.
    # To re-enable periodic generation, uncomment the cron line below:
    # - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate GitHub Contribution Grid Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/github-contribution-grid-snake.svg?color_snake=#FF6A1F&color_dots=#161616,#331F14,#732E0E,#B34715,#FF6A1F
            assets/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#FF6A1F&color_dots=#161616,#331F14,#732E0E,#B34715,#FF6A1F

      - name: Push Output Assets
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
