<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="p1-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#080808"/>
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1C1C1C"/>
      <stop offset="100%" stop-color="#101010"/>
    </linearGradient>

    <style>
      .font-mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    </style>
  </defs>

  <!-- Base Plate -->
  <rect width="700" height="300" rx="10" fill="url(#p1-bg)"/>
  <rect width="698" height="298" x="1" y="1" rx="9" fill="none" stroke="#242424" stroke-width="1"/>

  <!-- Top Metadata Bar -->
  <g transform="translate(30, 32)">
    <circle cx="6" cy="0" r="3" fill="#FF6A1F"/>
    <text x="18" y="4" fill="#A1A1A1" font-size="10" font-weight="700" letter-spacing="1.5" class="font-mono">PROJECT.01 // PRODUCTION SYSTEM</text>
    <text x="640" y="4" text-anchor="end" fill="#666666" font-size="9.5" class="font-mono">CLIENT: AAMBAALABS</text>
  </g>

  <!-- Left Info Column -->
  <g transform="translate(30, 75)">
    <text x="0" y="0" fill="#F5F5F0" font-size="20" font-weight="700" class="font-sans">AambaaLabs E-Commerce Engine</text>
    <text x="0" y="24" fill="#888888" font-size="11.5" class="font-sans">Real-time store management, inventory synchronization &amp; automated billing.</text>
    
    <!-- Tech Pills -->
    <g transform="translate(0, 50)">
      <rect width="70" height="22" rx="4" fill="#181818" stroke="#2A2A2A"/>
      <text x="35" y="14" text-anchor="middle" fill="#E5E5E5" font-size="9" font-weight="600" class="font-mono">Next.js 14</text>
      
      <rect x="78" width="65" height="22" rx="4" fill="#181818" stroke="#2A2A2A"/>
      <text x="110" y="14" text-anchor="middle" fill="#E5E5E5" font-size="9" font-weight="600" class="font-mono">Firebase</text>

      <rect x="151" width="65" height="22" rx="4" fill="#181818" stroke="#2A2A2A"/>
      <text x="183" y="14" text-anchor="middle" fill="#E5E5E5" font-size="9" font-weight="600" class="font-mono">Tailwind</text>

      <rect x="224" width="75" height="22" rx="4" fill="#181818" stroke="#2A2A2A"/>
      <text x="261" y="14" text-anchor="middle" fill="#E5E5E5" font-size="9" font-weight="600" class="font-mono">Analytics</text>
    </g>

    <!-- Key Metrics Highlight -->
    <g transform="translate(0, 115)">
      <text x="0" y="0" fill="#666666" font-size="9" font-weight="600" class="font-mono">SYNC LATENCY</text>
      <text x="0" y="18" fill="#FF6A1F" font-size="16" font-weight="700" class="font-mono">&lt; 120ms</text>

      <text x="110" y="0" fill="#666666" font-size="9" font-weight="600" class="font-mono">DATA STORES</text>
      <text x="110" y="18" fill="#F5F5F0" font-size="16" font-weight="700" class="font-mono">Firestore</text>
      
      <text x="210" y="0" fill="#666666" font-size="9" font-weight="600" class="font-mono">STATE</text>
      <text x="210" y="18" fill="#F5F5F0" font-size="16" font-weight="700" class="font-mono">Reactive</text>
    </g>
  </g>

  <!-- Right Visual Card: Abstract Telemetry UI -->
  <g transform="translate(380, 70)">
    <!-- Window Frame -->
    <rect width="285" height="195" rx="8" fill="url(#card-grad)" stroke="#282828"/>
    
    <!-- Header UI -->
    <circle cx="15" cy="14" r="3" fill="#333333"/>
    <circle cx="25" cy="14" r="3" fill="#333333"/>
    <circle cx="35" cy="14" r="3" fill="#333333"/>
    <line x1="0" y1="28" x2="285" y2="28" stroke="#222222"/>

    <!-- UI Stat Widget 1 -->
    <rect x="15" y="40" width="120" height="50" rx="5" fill="#121212" stroke="#222222"/>
    <text x="25" y="56" fill="#666666" font-size="8" class="font-mono">REVENUE RUNTIME</text>
    <text x="25" y="76" fill="#F5F5F0" font-size="14" font-weight="700" class="font-mono">₹ 148.5K</text>

    <!-- UI Stat Widget 2 -->
    <rect x="150" y="40" width="120" height="50" rx="5" fill="#121212" stroke="#222222"/>
    <text x="160" y="56" fill="#666666" font-size="8" class="font-mono">ORDER VELOCITY</text>
    <text x="160" y="76" fill="#FF6A1F" font-size="14" font-weight="700" class="font-mono">+24.8%</text>

    <!-- UI Trend Graph Line -->
    <g transform="translate(15, 105)">
      <rect width="255" height="75" rx="5" fill="#121212" stroke="#222222"/>
      <path d="M 10 55 L 45 45 L 85 50 L 125 30 L 165 38 L 205 18 L 245 22" fill="none" stroke="#FF6A1F" stroke-width="2" stroke-linecap="round"/>
      <circle cx="205" cy="18" r="3" fill="#0A0A0A" stroke="#FF6A1F" stroke-width="1.5"/>
      <text x="12" y="16" fill="#555555" font-size="7.5" class="font-mono">TELEMETRY STREAM</text>
    </g>
  </g>
</svg>
