<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="p2-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#080808"/>
    </linearGradient>

    <linearGradient id="scan-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF6A1F" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FF6A1F" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FF6A1F" stop-opacity="0.9"/>
    </linearGradient>

    <style>
      .font-mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

      @keyframes scanVertical {
        0%, 100% { transform: translateY(0px); opacity: 0.8; }
        50% { transform: translateY(65px); opacity: 1; }
      }

      @keyframes scorePulse {
        0%, 100% { filter: drop-shadow(0 0 2px rgba(255, 106, 31, 0.4)); }
        50% { filter: drop-shadow(0 0 8px rgba(255, 106, 31, 0.9)); }
      }

      .laser-scanner {
        animation: scanVertical 3.5s ease-in-out infinite;
      }

      .score-glow {
        animation: scorePulse 3s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Base Plate -->
  <rect width="700" height="300" rx="10" fill="url(#p2-bg)"/>
  <rect width="698" height="298" x="1" y="1" rx="9" fill="none" stroke="#242424" stroke-width="1"/>

  <!-- Top Metadata Bar -->
  <g transform="translate(30, 32)">
    <circle cx="6" cy="0" r="3.5" fill="#FF6A1F"/>
    <text x="18" y="4" fill="#A1A1A1" font-size="10" font-weight="700" letter-spacing="1.5" class="font-mono">PROJECT.02 // GENAI APPLICATION</text>
    <text x="640" y="4" text-anchor="end" fill="#666666" font-size="9.5" class="font-mono">INTELLIGENCE PLATFORM</text>
  </g>

  <!-- Left Info Column -->
  <g transform="translate(30, 75)">
    <text x="0" y="0" fill="#F5F5F0" font-size="20" font-weight="700" class="font-sans">AI Resume Intelligence Platform</text>
    <text x="0" y="24" fill="#888888" font-size="11.5" class="font-sans">LLM-powered resume parsing, ATS scoring vectors &amp; semantic keyword gap analysis.</text>
    
    <!-- Tech Pills -->
    <g transform="translate(0, 50)">
      <rect width="70" height="22" rx="4" fill="#181818" stroke="#2A2A2A"/>
      <text x="35" y="14" text-anchor="middle" fill="#E5E5E5" font-size="9" font-weight="600" class="font-mono">Next.js</text>
      
      <rect x="78" width="60" height="22" rx="4" fill="#181818" stroke="#2A2A2A"/>
      <text x="108" y="14" text-anchor="middle" fill="#E5E5E5" font-size="9" font-weight="600" class="font-mono">FastAPI</text>

      <rect x="146" width="60" height="22" rx="4" fill="#181818" stroke="#2A2A2A"/>
      <text x="176" y="14" text-anchor="middle" fill="#E5E5E5" font-size="9" font-weight="600" class="font-mono">Python</text>

      <rect x="214" width="70" height="22" rx="4" fill="#181818" stroke="#2A2A2A"/>
      <text x="249" y="14" text-anchor="middle" fill="#E5E5E5" font-size="9" font-weight="600" class="font-mono">OpenAI</text>
    </g>

    <!-- Key Metrics Highlight -->
    <g transform="translate(0, 115)">
      <text x="0" y="0" fill="#666666" font-size="9" font-weight="600" class="font-mono">MATCH ACCURACY</text>
      <text x="0" y="18" fill="#FF6A1F" font-size="16" font-weight="700" class="font-mono">94.8%</text>

      <text x="120" y="0" fill="#666666" font-size="9" font-weight="600" class="font-mono">VECTOR ENGINE</text>
      <text x="120" y="18" fill="#F5F5F0" font-size="16" font-weight="700" class="font-mono">Embeddings</text>
      
      <text x="230" y="0" fill="#666666" font-size="9" font-weight="600" class="font-mono">RESPONSE</text>
      <text x="230" y="18" fill="#F5F5F0" font-size="16" font-weight="700" class="font-mono">Streaming</text>
    </g>
  </g>

  <!-- Right Visual Card: Document Scanning & AI Vector Metaphor -->
  <g transform="translate(410, 70)">
    <rect width="250" height="195" rx="8" fill="#121212" stroke="#262626"/>
    
    <!-- Abstract Text Lines -->
    <line x1="25" y1="35" x2="140" y2="35" stroke="#444444" stroke-width="4" stroke-linecap="round"/>
    <line x1="25" y1="52" x2="220" y2="52" stroke="#222222" stroke-width="3" stroke-linecap="round"/>
    <line x1="25" y1="64" x2="190" y2="64" stroke="#222222" stroke-width="3" stroke-linecap="round"/>
    <line x1="25" y1="76" x2="210" y2="76" stroke="#222222" stroke-width="3" stroke-linecap="round"/>
    <line x1="25" y1="88" x2="170" y2="88" stroke="#222222" stroke-width="3" stroke-linecap="round"/>

    <!-- Animated Scanning Laser Effect -->
    <g class="laser-scanner">
      <rect x="15" y="40" width="220" height="25" fill="url(#scan-grad)" opacity="0.4"/>
      <line x1="15" y1="65" x2="235" y2="65" stroke="#FF6A1F" stroke-width="2"/>
      <circle cx="235" cy="65" r="3" fill="#FF6A1F"/>
    </g>

    <!-- Output AI Match Analysis Badge -->
    <g class="score-glow">
      <rect x="25" y="145" width="200" height="35" rx="5" fill="#1A1A1A" stroke="#FF6A1F" stroke-width="1.2"/>
      <text x="40" y="166" fill="#F5F5F0" font-size="11" font-weight="600" class="font-sans">ATS Score Index: </text>
      <text x="145" y="166" fill="#FF6A1F" font-size="12" font-weight="700" class="font-mono">92 / 100</text>
    </g>
  </g>
</svg>
