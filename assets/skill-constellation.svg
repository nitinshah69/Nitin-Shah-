<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 310" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="sc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0E0E"/>
      <stop offset="100%" stop-color="#070707"/>
    </linearGradient>

    <style>
      .font-mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

      @keyframes linkPulse {
        0%, 100% { stroke-opacity: 0.3; }
        50% { stroke-opacity: 0.8; }
      }

      .animated-link {
        animation: linkPulse 4s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Base Plate -->
  <rect width="920" height="310" rx="10" fill="url(#sc-bg)"/>
  <rect width="918" height="308" x="1" y="1" rx="9" fill="none" stroke="#242424" stroke-width="1"/>

  <!-- Top Title -->
  <g transform="translate(35, 32)">
    <text x="0" y="0" fill="#F5F5F0" font-size="12" font-weight="700" letter-spacing="1.5" class="font-mono">ARCHITECTURE CONSTELLATION // DEPENDENCY TOPOLOGY</text>
    <text x="850" y="0" text-anchor="end" fill="#666666" font-size="9.5" class="font-mono">SYSTEM COHESION</text>
  </g>

  <!-- Center Hub: [ AI / FULL-STACK ] -->
  <!-- Center Coordinates: (460, 165) -->
  <g transform="translate(460, 165)">
    <circle cx="0" cy="0" r="42" fill="#141414" stroke="#FF6A1F" stroke-width="2"/>
    <circle cx="0" cy="0" r="50" fill="none" stroke="#FF6A1F" stroke-width="1" stroke-dasharray="3 3" opacity="0.4"/>
    <text x="0" y="-5" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="700" class="font-mono">AI / FULL-STACK</text>
    <text x="0" y="10" text-anchor="middle" fill="#FF6A1F" font-size="9" font-weight="600" class="font-mono">CORE HUB</text>
  </g>

  <!-- Connecting Lines from Center (460, 165) -->
  <!-- To Next.js (250, 95) -->
  <line x1="460" y1="165" x2="250" y2="95" stroke="#FF6A1F" stroke-width="1.5" class="animated-link"/>
  <!-- To React (110, 150) -->
  <line x1="250" y1="95" x2="110" y2="150" stroke="#FF6A1F" stroke-width="1.2" stroke-dasharray="2 2"/>
  <!-- To TypeScript (140, 240) -->
  <line x1="460" y1="165" x2="140" y2="240" stroke="#FF6A1F" stroke-width="1.2"/>
  <!-- To Node.js / FastAPI (310, 245) -->
  <line x1="460" y1="165" x2="310" y2="245" stroke="#FF6A1F" stroke-width="1.5" class="animated-link"/>
  <!-- To PostgreSQL / Firebase (610, 245) -->
  <line x1="460" y1="165" x2="610" y2="245" stroke="#FF6A1F" stroke-width="1.2"/>
  <!-- To Docker / Cloud (780, 240) -->
  <line x1="610" y1="245" x2="780" y2="240" stroke="#333333" stroke-width="1"/>
  <!-- To LLMs / GenAI (670, 95) -->
  <line x1="460" y1="165" x2="670" y2="95" stroke="#FF6A1F" stroke-width="1.5" class="animated-link"/>
  <!-- To RAG & Vector (810, 150) -->
  <line x1="670" y1="95" x2="810" y2="150" stroke="#FF6A1F" stroke-width="1.2" stroke-dasharray="2 2"/>
  <!-- To Agentic Systems (460, 70) -->
  <line x1="460" y1="165" x2="460" y2="70" stroke="#FFA066" stroke-width="1.5"/>

  <!-- Surrounding Node 1: Next.js 14 (250, 95) -->
  <g transform="translate(250, 95)">
    <circle cx="0" cy="0" r="24" fill="#141414" stroke="#FF6A1F" stroke-width="1.5"/>
    <text x="0" y="3" text-anchor="middle" fill="#F5F5F0" font-size="9" font-weight="700" class="font-mono">Next.js</text>
  </g>

  <!-- Surrounding Node 2: React (110, 150) -->
  <g transform="translate(110, 150)">
    <circle cx="0" cy="0" r="22" fill="#121212" stroke="#444444" stroke-width="1.2"/>
    <text x="0" y="3" text-anchor="middle" fill="#A1A1A1" font-size="8.5" font-weight="600" class="font-mono">React</text>
  </g>

  <!-- Surrounding Node 3: TypeScript (140, 240) -->
  <g transform="translate(140, 240)">
    <circle cx="0" cy="0" r="22" fill="#121212" stroke="#444444" stroke-width="1.2"/>
    <text x="0" y="3" text-anchor="middle" fill="#A1A1A1" font-size="8.5" font-weight="600" class="font-mono">TypeScript</text>
  </g>

  <!-- Surrounding Node 4: FastAPI / Node (310, 245) -->
  <g transform="translate(310, 245)">
    <circle cx="0" cy="0" r="24" fill="#141414" stroke="#FF6A1F" stroke-width="1.5"/>
    <text x="0" y="3" text-anchor="middle" fill="#F5F5F0" font-size="9" font-weight="700" class="font-mono">FastAPI</text>
  </g>

  <!-- Surrounding Node 5: Agentic Systems (460, 70) -->
  <g transform="translate(460, 70)">
    <circle cx="0" cy="0" r="24" fill="#141414" stroke="#FFA066" stroke-width="1.5"/>
    <text x="0" y="3" text-anchor="middle" fill="#FFA066" font-size="9" font-weight="700" class="font-mono">Agents</text>
  </g>

  <!-- Surrounding Node 6: LLMs & GenAI (670, 95) -->
  <g transform="translate(670, 95)">
    <circle cx="0" cy="0" r="24" fill="#141414" stroke="#FF6A1F" stroke-width="1.5"/>
    <text x="0" y="3" text-anchor="middle" fill="#F5F5F0" font-size="9" font-weight="700" class="font-mono">LLMs</text>
  </g>

  <!-- Surrounding Node 7: RAG & Vectors (810, 150) -->
  <g transform="translate(810, 150)">
    <circle cx="0" cy="0" r="22" fill="#121212" stroke="#444444" stroke-width="1.2"/>
    <text x="0" y="3" text-anchor="middle" fill="#A1A1A1" font-size="8.5" font-weight="600" class="font-mono">RAG</text>
  </g>

  <!-- Surrounding Node 8: PostgreSQL & Firestore (610, 245) -->
  <g transform="translate(610, 245)">
    <circle cx="0" cy="0" r="24" fill="#141414" stroke="#FF6A1F" stroke-width="1.5"/>
    <text x="0" y="3" text-anchor="middle" fill="#F5F5F0" font-size="9" font-weight="700" class="font-mono">Postgres</text>
  </g>

  <!-- Surrounding Node 9: Docker & Cloud (780, 240) -->
  <g transform="translate(780, 240)">
    <circle cx="0" cy="0" r="22" fill="#121212" stroke="#444444" stroke-width="1.2"/>
    <text x="0" y="3" text-anchor="middle" fill="#A1A1A1" font-size="8.5" font-weight="600" class="font-mono">Docker</text>
  </g>
</svg>
