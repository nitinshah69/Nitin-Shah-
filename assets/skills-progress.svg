<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="sp-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#101010"/>
      <stop offset="100%" stop-color="#080808"/>
    </linearGradient>

    <linearGradient id="sp-thread" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6A1F" stop-opacity="0.2"/>
      <stop offset="70%" stop-color="#FF6A1F" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FFA066" stop-opacity="0.8"/>
    </linearGradient>

    <style>
      .font-mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    </style>
  </defs>

  <!-- Container Base -->
  <rect width="920" height="280" rx="10" fill="url(#sp-bg)"/>
  <rect width="918" height="278" x="1" y="1" rx="9" fill="none" stroke="#242424" stroke-width="1"/>

  <!-- Header -->
  <g transform="translate(35, 32)">
    <text x="0" y="0" fill="#F5F5F0" font-size="12" font-weight="700" letter-spacing="1.5" class="font-mono">ENGINEERING MASTERY // HORIZONTAL JOURNEYS</text>
    <text x="850" y="0" text-anchor="end" fill="#666666" font-size="9.5" class="font-mono">NON-LINEAR TRAJECTORY</text>
  </g>

  <!-- Skill Row 1: React.js & Next.js 14 -->
  <g transform="translate(35, 75)">
    <text x="0" y="0" fill="#E5E5E5" font-size="12" font-weight="600" class="font-sans">React.js &amp; Next.js 14</text>
    <text x="180" y="0" fill="#666666" font-size="9.5" class="font-mono">App Router · Server Actions</text>
    <!-- Journey Track -->
    <line x1="360" y1="-4" x2="720" y2="-4" stroke="#222222" stroke-width="2"/>
    <line x1="360" y1="-4" x2="685" y2="-4" stroke="url(#sp-thread)" stroke-width="2"/>
    <circle cx="360" cy="-4" r="3.5" fill="#FF6A1F"/>
    <circle cx="685" cy="-4" r="4.5" fill="#0A0A0A" stroke="#FF6A1F" stroke-width="2"/>
    <!-- Status Tag -->
    <rect x="750" y="-14" width="95" height="20" rx="4" fill="#181818" stroke="#2A2A2A"/>
    <text x="797" y="0" text-anchor="middle" fill="#FF6A1F" font-size="9" font-weight="700" class="font-mono">PRODUCTION</text>
  </g>

  <!-- Skill Row 2: TypeScript & JavaScript -->
  <g transform="translate(35, 110)">
    <text x="0" y="0" fill="#E5E5E5" font-size="12" font-weight="600" class="font-sans">TypeScript &amp; JavaScript</text>
    <text x="180" y="0" fill="#666666" font-size="9.5" class="font-mono">Strict Types · ES2024</text>
    <!-- Journey Track -->
    <line x1="360" y1="-4" x2="720" y2="-4" stroke="#222222" stroke-width="2"/>
    <line x1="360" y1="-4" x2="670" y2="-4" stroke="url(#sp-thread)" stroke-width="2"/>
    <circle cx="360" cy="-4" r="3.5" fill="#FF6A1F"/>
    <circle cx="670" cy="-4" r="4.5" fill="#0A0A0A" stroke="#FF6A1F" stroke-width="2"/>
    <!-- Status Tag -->
    <rect x="750" y="-14" width="95" height="20" rx="4" fill="#181818" stroke="#2A2A2A"/>
    <text x="797" y="0" text-anchor="middle" fill="#FF6A1F" font-size="9" font-weight="700" class="font-mono">PRODUCTION</text>
  </g>

  <!-- Skill Row 3: Python & FastAPI -->
  <g transform="translate(35, 145)">
    <text x="0" y="0" fill="#E5E5E5" font-size="12" font-weight="600" class="font-sans">Python &amp; FastAPI</text>
    <text x="180" y="0" fill="#666666" font-size="9.5" class="font-mono">Async REST · Pydantic</text>
    <!-- Journey Track -->
    <line x1="360" y1="-4" x2="720" y2="-4" stroke="#222222" stroke-width="2"/>
    <line x1="360" y1="-4" x2="600" y2="-4" stroke="url(#sp-thread)" stroke-width="2"/>
    <circle cx="360" cy="-4" r="3.5" fill="#FF6A1F"/>
    <circle cx="600" cy="-4" r="4.5" fill="#0A0A0A" stroke="#FF6A1F" stroke-width="2"/>
    <!-- Status Tag -->
    <rect x="750" y="-14" width="95" height="20" rx="4" fill="#181818" stroke="#2A2A2A"/>
    <text x="797" y="0" text-anchor="middle" fill="#F5F5F0" font-size="9" font-weight="600" class="font-mono">COMFORTABLE</text>
  </g>

  <!-- Skill Row 4: Firebase & Databases (SQL / NoSQL) -->
  <g transform="translate(35, 180)">
    <text x="0" y="0" fill="#E5E5E5" font-size="12" font-weight="600" class="font-sans">Firebase, SQL &amp; NoSQL</text>
    <text x="180" y="0" fill="#666666" font-size="9.5" class="font-mono">Firestore · PostgreSQL · MySQL</text>
    <!-- Journey Track -->
    <line x1="360" y1="-4" x2="720" y2="-4" stroke="#222222" stroke-width="2"/>
    <line x1="360" y1="-4" x2="650" y2="-4" stroke="url(#sp-thread)" stroke-width="2"/>
    <circle cx="360" cy="-4" r="3.5" fill="#FF6A1F"/>
    <circle cx="650" cy="-4" r="4.5" fill="#0A0A0A" stroke="#FF6A1F" stroke-width="2"/>
    <!-- Status Tag -->
    <rect x="750" y="-14" width="95" height="20" rx="4" fill="#181818" stroke="#2A2A2A"/>
    <text x="797" y="0" text-anchor="middle" fill="#FF6A1F" font-size="9" font-weight="700" class="font-mono">PRODUCTION</text>
  </g>

  <!-- Skill Row 5: LLMs, RAG & Vector Embeddings -->
  <g transform="translate(35, 215)">
    <text x="0" y="0" fill="#E5E5E5" font-size="12" font-weight="600" class="font-sans">LLMs, RAG &amp; Embeddings</text>
    <text x="180" y="0" fill="#666666" font-size="9.5" class="font-mono">OpenAI · Vector Search</text>
    <!-- Journey Track -->
    <line x1="360" y1="-4" x2="720" y2="-4" stroke="#222222" stroke-width="2"/>
    <line x1="360" y1="-4" x2="520" y2="-4" stroke="url(#sp-thread)" stroke-width="2"/>
    <circle cx="360" cy="-4" r="3.5" fill="#FF6A1F"/>
    <circle cx="520" cy="-4" r="4.5" fill="#0A0A0A" stroke="#FF6A1F" stroke-width="2"/>
    <!-- Status Tag -->
    <rect x="750" y="-14" width="95" height="20" rx="4" fill="#181818" stroke="#2A2A2A"/>
    <text x="797" y="0" text-anchor="middle" fill="#FFA066" font-size="9" font-weight="700" class="font-mono">BUILDING</text>
  </g>

  <!-- Skill Row 6: Agentic Workflows & LangGraph -->
  <g transform="translate(35, 250)">
    <text x="0" y="0" fill="#E5E5E5" font-size="12" font-weight="600" class="font-sans">Agentic Systems &amp; LangGraph</text>
    <text x="180" y="0" fill="#666666" font-size="9.5" class="font-mono">Tool Calling · Multi-Agent</text>
    <!-- Journey Track -->
    <line x1="360" y1="-4" x2="720" y2="-4" stroke="#222222" stroke-width="2"/>
    <line x1="360" y1="-4" x2="430" y2="-4" stroke="url(#sp-thread)" stroke-width="2"/>
    <circle cx="360" cy="-4" r="3.5" fill="#FF6A1F"/>
    <circle cx="430" cy="-4" r="4.5" fill="#0A0A0A" stroke="#FF6A1F" stroke-width="2"/>
    <!-- Status Tag -->
    <rect x="750" y="-14" width="95" height="20" rx="4" fill="#181818" stroke="#2A2A2A"/>
    <text x="797" y="0" text-anchor="middle" fill="#A1A1A1" font-size="9" font-weight="600" class="font-mono">LEARNING</text>
  </g>
</svg>
